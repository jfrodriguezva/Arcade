		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #4d299e;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	<style>
#status{background:linear-gradient(180deg,#6a35c9 0%,#4d299e 55%,#3a2a9a 100%)!important}
#status-progress{opacity:0!important;pointer-events:none}
#carga{position:absolute;left:0;right:0;bottom:9%;display:flex;flex-direction:column;align-items:center;
 gap:10px;font-family:'Fredoka','Noto Sans',Arial,sans-serif;color:#fff;padding:0 24px}
#carga-barra{width:min(78vw,420px);height:22px;border-radius:12px;background:rgba(255,255,255,.18);
 box-shadow:inset 0 2px 4px rgba(0,0,0,.25);overflow:hidden}
#carga-relleno{height:100%;width:3%;border-radius:12px;transition:width .25s ease-out;
 background:linear-gradient(90deg,#ff549a,#ffcc38,#21d6c7);background-size:200% 100%;animation:carga-brillo 1.6s linear infinite}
@keyframes carga-brillo{from{background-position:0 0}to{background-position:200% 0}}
#carga-num{font-size:20px;font-weight:700;text-shadow:0 2px 3px rgba(0,0,0,.35)}
#carga-tip{font-size:15px;color:#e6defa;text-align:center;max-width:min(440px,88vw);min-height:2.6em;transition:opacity .4s}
</style>
<script>window.addEventListener("DOMContentLoaded",function(){
var s=document.getElementById("status"),p=document.getElementById("status-progress");if(!s||!p)return;
var c=document.createElement("div");c.id="carga";
c.innerHTML='<div id="carga-num">Cargando…</div><div id="carga-barra"><div id="carga-relleno"></div></div><div id="carga-tip"></div>';
s.appendChild(c);
var tips=["La primera vez tarda un poco; después abre al instante.","🔥 Haz el reto del día para no perder tu racha.",
"🎁 Cada día que entras hay un regalo de monedas, y crece si vienes seguido.","🛍 Con tus monedas compras avatares en la Tienda.",
"📤 Al ganar puedes compartir tu resultado con tus amigos.","📶 Juega en red con amigos cerca: uno crea la sala y los demás se unen.",
"🎉 Modo Fiesta: de 1 a 4 personas en un mismo celular.","⭐ Toca la estrella de un juego para tenerlo en Favoritos."];
var tip=document.getElementById("carga-tip"),i=0;tip.textContent=tips[0];
setInterval(function(){tip.style.opacity=0;setTimeout(function(){i=(i+1)%tips.length;tip.textContent=tips[i];tip.style.opacity=1;},400);},3800);
var num=document.getElementById("carga-num"),bar=document.getElementById("carga-relleno");
(function tick(){if(s.style.visibility==="hidden"||s.style.display==="none")return;
if(p.max>1&&p.hasAttribute("value")){var f=Math.min(p.value/p.max,1);bar.style.width=Math.max(3,f*100)+"%";
num.textContent=(f>=.999?"Preparando los juegos…":"Cargando "+Math.round(f*100)+"%  ·  "+(p.value/1048576).toFixed(1)+" de "+(p.max/1048576).toFixed(1)+" MB");}
requestAnimationFrame(tick);})();});</script>
<script>window.arcadeInstall={ev:null};window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.arcadeInstall.ev=e;});window.addEventListener('appinstalled',function(){window.arcadeInstall.ev=null;});</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10859860,"index.wasm":25133276},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
